name: win-debug
on:
  push:
    branches: [fix-windows]
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run build:plugins
      - run: node -e "console.log(require('os').tmpdir(), process.cwd())"
      - run: pnpm --filter @browserglass/cli --filter @browserglass/conformance --no-bail run test
      - if: always()
        run: pnpm --filter @browserglass/conformance run test
      - if: always()
        run: pnpm --filter @browserglass/runtime-host run test
